<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Relish</title>
    <meta name="description" content="Private nutrition and exercise tracker." />
    <meta name="theme-color" content="#f4efe4" />
    <!-- Installable home-screen app. iOS still reads the apple-* tags. With the default
         status bar style the app is laid out below the status bar, so no safe-area padding
         is needed at the top. -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preload" as="image" href="/splash.jpg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Relish" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
        background-color: #f4efe4;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
        /* Keep content clear of the iPhone home indicator. */
        padding-bottom: env(safe-area-inset-bottom);
        box-sizing: border-box;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* The only launch splash on web: a layer above the app that stays until the first real
         screen is ready, then fades out (dismissLaunchSplash in src/lib/launch-splash-dom.ts).
         The image never changes hands, so nothing can blink. */
      .launch-splash {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #f4efe4;
        opacity: 1;
        transition: opacity 200ms ease-out;
      }
      .launch-splash.is-hidden {
        opacity: 0;
        pointer-events: none;
      }
      .launch-splash img {
        width: min(70vw, 300px);
        height: auto;
        aspect-ratio: 600 / 840;
      }
    </style>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <div id="root"></div>
    <div id="launch-splash" class="launch-splash" aria-hidden="true"><img src="/splash.jpg" alt="" /></div>
    <script>
      // Failsafe: never leave the splash over the app if the app fails to dismiss it.
      setTimeout(function () {
        var splash = document.getElementById('launch-splash');
        if (splash) { splash.classList.add('is-hidden'); setTimeout(function () { splash.remove(); }, 250); }
      }, 15000);
    </script>
  </body>
</html>
