[project]
name = "nutrition-os-backend"
version = "0.1.0"
description = "FastAPI backend for the Nutrition OS app."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "http-ece>=1.2.1,<2.0.0",
  "httpx>=0.28.0,<1.0.0",
  "py-vapid>=1.9.6,<2.0.0",
  "pydantic-settings>=2.6.0,<3.0.0",
  "python-multipart>=0.0.12,<1.0.0",
  "uvicorn[standard]>=0.32.0,<1.0.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<9.0.0",
  "pytest-asyncio>=0.24.0,<1.0.0",
  "ruff>=0.8.0,<1.0.0"
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

# Only the backend is a Python package; the repo root also holds frontend/, tests/, deploy/,
# and docs/, which setuptools would otherwise refuse to guess between.
[tool.setuptools.packages.find]
include = ["backend*"]

[tool.setuptools.package-data]
"backend.app.db" = ["migrations/*.sql"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
